<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>card</title>
<!-- Rendered by record.mjs: window.render(data) fills the card, window.go() starts the motion.
     Layout is 1440x810 CSS px, captured at DPR 4/3 = 1920x1080. -->
<style>
  :root {
    --bg: #0b1014; --surface: #121a20; --fg: #eef4f2; --muted: #93a39f; --accent: #3ee0c0; --accent2: #7aa7ff;
    --font: "Inter", system-ui, "Segoe UI", sans-serif; --display: var(--font);
    --ease: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 810px; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body::before { /* tinted light, never flat black */
    content: ""; position: fixed; inset: -20%;
    background:
      radial-gradient(40% 50% at 18% 30%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(45% 55% at 85% 80%, color-mix(in oklab, var(--accent2) 14%, transparent), transparent 70%);
    opacity: 0; transition: opacity 1.6s var(--ease), transform 14s linear;
  }
  body.go::before { opacity: 1; transform: translate3d(-2%, 1%, 0) scale(1.04); }
  .stage { position: relative; width: 100%; height: 100%; padding: 96px 112px; display: flex; align-items: center; gap: 72px; }
  .copy { flex: 1 1 0; min-width: 0; }
  /* Sentence case with an accent dot: tracked all-caps eyebrows are a generated-look tell. */
  .kicker { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; letter-spacing: .005em; color: var(--muted); font-weight: 600; margin-bottom: 26px; }
  .kicker::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .center .kicker { justify-content: center; }
  .name { font-family: var(--display); font-size: 132px; line-height: .95; letter-spacing: -.035em; font-weight: 750; }
  .tagline { font-size: 38px; line-height: 1.25; color: var(--muted); margin-top: 30px; max-width: 18ch; text-wrap: balance; }
  .lines { font-family: var(--display); font-size: 68px; line-height: 1.12; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; }
  .lines .line { display: block; }
  .lines .line + .line { margin-top: 18px; }
  .lines .line.dim { color: var(--muted); font-weight: 600; }
  .sub { font-size: 30px; color: var(--muted); margin-top: 34px; max-width: 34ch; line-height: 1.35; }
  em { font-style: normal; color: var(--accent); }
  .stat { font-family: var(--display); font-size: 210px; font-weight: 800; letter-spacing: -.05em; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
  .url { display: inline-flex; align-items: center; gap: 14px; margin-top: 44px; padding: 16px 26px; border-radius: 999px;
    background: color-mix(in oklab, var(--accent) 14%, var(--surface)); color: var(--fg); font-size: 30px; font-weight: 600;
    border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
  .url::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 22%, transparent); }
  .credit { margin-top: 30px; color: var(--muted); font-size: 22px; letter-spacing: .02em; }

  /* Product shot in a quiet browser frame. */
  .shot { flex: 0 0 auto; width: 640px; border-radius: 18px; overflow: hidden; background: var(--surface);
    box-shadow: 0 40px 90px -30px rgba(0,0,0,.6), 0 0 0 1px color-mix(in oklab, var(--fg) 10%, transparent);
    transform: translate3d(40px, 30px, 0) rotate(-1.5deg) scale(.96); opacity: 0;
    transition: transform 1.4s var(--ease) .35s, opacity .9s var(--ease) .35s; }
  .shot .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: color-mix(in oklab, var(--fg) 6%, var(--surface)); }
  .shot .bar i { width: 11px; height: 11px; border-radius: 50%; background: color-mix(in oklab, var(--fg) 22%, transparent); }
  .shot img { display: block; width: 100%; height: auto; }
  body.go .shot { transform: none; opacity: 1; animation: drift 12s linear 1.8s forwards; }
  @keyframes drift { to { transform: translate3d(-6px, -10px, 0) scale(1.025); } }
  /* Solution card: the name, one sentence, up to three short "how" points, and the product big. */
  .solution .name { font-size: 92px; }
  .solution .one { font-family: var(--display); font-size: 46px; line-height: 1.16; letter-spacing: -.02em; font-weight: 650; margin-top: 22px; max-width: 17ch; text-wrap: balance; }
  .points { list-style: none; margin-top: 34px; display: grid; gap: 14px; }
  .points li { display: flex; align-items: baseline; gap: 14px; font-size: 28px; color: var(--muted); }
  .points li::before { content: ""; flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: translateY(-4px); }
  .solution .shot { width: 760px; transform: translate3d(60px, 0, 0) scale(.92); }
  .center .stage { justify-content: center; text-align: center; }

  /* ---------- pitch-deck slides ---------- */
  /* Chapter rail: where we are in the story. Quiet, top-left, same on every slide. */
  .rail { position: absolute; top: 40px; left: 112px; display: flex; gap: 26px; font-size: 19px; font-weight: 600; color: color-mix(in oklab, var(--muted) 70%, transparent); }
  .rail span { display: inline-flex; align-items: center; gap: 9px; }
  .rail span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; }
  .rail .on { color: var(--fg); }
  .rail .on::before { background: var(--accent); opacity: 1; box-shadow: 0 0 0 5px color-mix(in oklab, var(--accent) 22%, transparent); }
  .rail .done { color: var(--muted); }
  .deckbar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--accent); width: var(--from, 0%); transition: width 1.2s var(--ease) .2s; }
  body.go .deckbar { width: var(--to, 0%); }

  .head { font-family: var(--display); font-size: 64px; line-height: 1.08; letter-spacing: -.028em; font-weight: 750; max-width: 22ch; text-wrap: balance; }
  .deck .stage { flex-direction: column; align-items: stretch; justify-content: center; gap: 0; }

  /* problem: the pain as a headline, then up to three pieces of evidence. */
  .rows { margin-top: 46px; display: grid; gap: 18px; }
  .row { display: grid; grid-template-columns: 220px 1fr; align-items: baseline; gap: 28px; padding: 22px 28px; border-radius: 16px;
    background: color-mix(in oklab, var(--fg) 4%, var(--surface)); border: 1px solid color-mix(in oklab, var(--fg) 9%, transparent); }
  .row .big { font-family: var(--display); font-size: 54px; font-weight: 800; letter-spacing: -.03em; color: var(--accent2); font-variant-numeric: tabular-nums; line-height: 1; }
  .row .txt { font-size: 30px; line-height: 1.3; }
  .row .src { display: block; margin-top: 6px; font-size: 18px; color: var(--muted); }
  .row.noval { grid-template-columns: 1fr; }

  /* compare: today vs with the product. The old steps get struck through, the new path lights up. */
  .cols { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .col { padding: 30px 32px; border-radius: 18px; background: color-mix(in oklab, var(--fg) 4%, var(--surface)); border: 1px solid color-mix(in oklab, var(--fg) 9%, transparent); }
  .col.now { border-color: color-mix(in oklab, var(--accent) 55%, transparent); background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
  .col h3 { font-size: 24px; font-weight: 700; color: var(--muted); margin-bottom: 18px; display: flex; justify-content: space-between; }
  .col.now h3 { color: var(--accent); }
  .col ol { list-style: none; display: grid; gap: 12px; counter-reset: s; }
  .col li { counter-increment: s; font-size: 28px; line-height: 1.25; display: flex; gap: 14px; position: relative; }
  .col li::before { content: counter(s); flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 700;
    background: color-mix(in oklab, var(--fg) 10%, transparent); color: var(--muted); }
  .col.now li::before { background: var(--accent); color: var(--bg); }
  .col.was li > span { position: relative; }
  .col.was li > span::after { content: ""; position: absolute; left: 0; top: 55%; height: 2px; width: 0; background: color-mix(in oklab, var(--accent2) 80%, var(--fg));
    transition: width .5s var(--ease); transition-delay: var(--x, 99s); }
  body.go .col.was li > span::after { width: 100%; }
  .tally { margin-top: 30px; font-family: var(--display); font-size: 38px; font-weight: 750; letter-spacing: -.02em; }

  /* flow: how it works, as nodes on a line. The line draws, each node lights when the voice reaches it. */
  .flow { margin-top: 70px; position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 24px; }
  .flow .track { position: absolute; left: calc(50% / var(--n)); right: calc(50% / var(--n)); top: 38px; height: 3px; background: color-mix(in oklab, var(--fg) 12%, transparent); border-radius: 3px; overflow: hidden; }
  .flow .track i { position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform var(--draw, 2s) cubic-bezier(.45,0,.2,1) var(--d0, .4s); }
  body.go .flow .track i { transform: scaleX(1); }
  .node { position: relative; text-align: center; display: grid; justify-items: center; align-content: start; gap: 14px; }
  .node .dot { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800;
    background: var(--surface); border: 3px solid color-mix(in oklab, var(--fg) 16%, transparent); color: var(--muted);
    transition: background .45s var(--ease), border-color .45s var(--ease), color .45s var(--ease), transform .6s cubic-bezier(.34,1.4,.64,1);
    transition-delay: var(--d, 0s); }
  body.go .node .dot { background: var(--accent); border-color: var(--accent); color: var(--bg); transform: scale(1.06); }
  .node b { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .node small { font-size: 22px; color: var(--muted); line-height: 1.3; max-width: 15ch; }

  /* quote: a real person's words, with where they said them. */
  .quote { font-family: var(--display); font-size: 58px; line-height: 1.16; letter-spacing: -.02em; font-weight: 650; max-width: 24ch; text-wrap: balance; }
  .quote::before { content: "\201C"; display: block; font-size: 140px; line-height: .6; color: var(--accent); margin-bottom: 8px; }
  .who { margin-top: 34px; font-size: 26px; color: var(--muted); }
  .who b { color: var(--fg); font-weight: 650; }
  .center .tagline, .center .sub { margin-left: auto; margin-right: auto; }

  /* Word reveal: each word rises out of a mask, staggered. */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
  .w > span { display: inline-block; transform: translateY(105%); opacity: 0; transition: transform .9s var(--ease), opacity .6s var(--ease); transition-delay: var(--d, 0s); }
  body.go .w > span { transform: none; opacity: 1; }
  .fade { opacity: 0; transform: translateY(16px); transition: opacity .8s var(--ease), transform .9s var(--ease); transition-delay: var(--d, 0s); }
  body.go .fade { opacity: 1; transform: none; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // "*word*" marks accent words. Splits into masked words with staggered delays.
  function words(text, start, step) {
    let i = 0;
    // An accent span may cover several words ("*one signature*"), so track open/close across tokens.
    let inAccent = false;
    return esc(text).split(/(\s+)/).map((tok) => {
      if (/^\s+$/.test(tok) || !tok) return tok;
      let word = tok;
      if (word.startsWith('*')) { inAccent = true; word = word.slice(1); }
      const m = word.match(/^(.*?)\*([.,!?;:]*)$/);
      const accent = inAccent;
      let tail = '';
      if (m) { word = m[1]; tail = m[2]; inAccent = false; }
      const inner = accent ? `<em>${word}</em>${tail}` : word + tail;
      return `<span class="w"><span style="--d:${(start + step * i++).toFixed(2)}s">${inner}</span></span>`;
    }).join('');
  }
  const count = (s) => String(s || '').split(/\s+/).filter(Boolean).length;

  window.render = (d) => {
    const t = d.theme || {};
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries({ bg: t.bg, surface: t.surface, fg: t.fg, muted: t.muted, accent: t.accent, accent2: t.accent2 })) if (v) root.setProperty('--' + k, v);
    if (t.font) root.setProperty('--font', t.font);
    if (t.display) root.setProperty('--display', t.display);
    if (t.fontUrl) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = t.fontUrl; document.head.appendChild(l); }
    const s = document.getElementById('stage');
    const shot = d.image ? `<div class="shot"><div class="bar"><i></i><i></i><i></i></div><img src="${esc(d.image)}"></div>` : '';
    let html = '';
    if (d.template === 'title') {
      html = `<div class="copy">
          ${d.kicker ? `<div class="kicker fade" style="--d:.05s">${esc(d.kicker)}</div>` : ''}
          <h1 class="name">${words(d.name, .15, .08)}</h1>
          ${d.tagline ? `<p class="tagline">${words(d.tagline, .55, .045)}</p>` : ''}
        </div>${shot}`;
      if (!d.image) document.body.classList.add('center');
    } else if (d.template === 'statement') {
      let delay = .1;
      const lines = (d.lines || []).map((l) => {
        const txt = typeof l === 'string' ? l : l.text;
        const dim = typeof l === 'object' && l.dim;
        const at = typeof l === 'object' && l.at != null ? l.at : delay;
        const out = `<span class="line${dim ? ' dim' : ''}">${words(txt, at, .06)}</span>`;
        delay = at + count(txt) * .06 + .45;
        return out;
      }).join('');
      html = `<div class="copy">
          ${d.kicker ? `<div class="kicker fade" style="--d:0s">${esc(d.kicker)}</div>` : ''}
          <div class="lines">${lines}</div>
          ${d.sub ? `<p class="sub fade" style="--d:${(delay + .1).toFixed(2)}s">${esc(d.sub)}</p>` : ''}
        </div>${shot}`;
      if (d.center) document.body.classList.add('center');
    } else if (d.template === 'stat') {
      html = `<div class="copy">
          ${d.kicker ? `<div class="kicker fade">${esc(d.kicker)}</div>` : ''}
          <div class="stat" id="stat" data-to="${esc(d.value)}">${esc(d.value)}</div>
          <p class="sub fade" style="--d:.5s">${esc(d.caption || '')}</p>
          ${d.source ? `<p class="credit fade" style="--d:.9s">${esc(d.source)}</p>` : ''}
        </div>${shot}`;
    } else if (d.template === 'solution') {
      document.body.classList.add('solution');
      const one = d.line || d.tagline || '';
      const at = .45 + count(d.name) * .08;
      const pts = (d.points || []).slice(0, 3);
      const after = at + count(one) * .05 + .35;
      html = `<div class="copy">
          ${d.kicker ? `<div class="kicker fade" style="--d:0s">${esc(d.kicker)}</div>` : ''}
          <h1 class="name">${words(d.name, .1, .08)}</h1>
          ${one ? `<p class="one">${words(one, at, .05)}</p>` : ''}
          ${pts.length ? `<ul class="points">${pts.map((p, i) => `<li class="fade" style="--d:${(after + i * .35).toFixed(2)}s">${esc(p)}</li>`).join('')}</ul>` : ''}
        </div>${shot}`;
    } else if (d.template === 'problem') {
      // The pain as one headline, then evidence rows. A row with a number carries its source on screen.
      document.body.classList.add('deck');
      const rows = (d.rows || []).slice(0, 3);
      let at = .25 + count(d.head) * .06 + .3;
      html = `${d.kicker ? `<div class="kicker fade" style="--d:0s">${esc(d.kicker)}</div>` : ''}
        <h2 class="head">${words(d.head, .15, .06)}</h2>
        <div class="rows">${rows.map((r) => {
          const t = r.at ?? at; at = t + .55;
          return `<div class="row fade${r.value ? '' : ' noval'}" style="--d:${t.toFixed(2)}s">
            ${r.value ? `<span class="big">${esc(r.value)}</span>` : ''}
            <span class="txt">${esc(r.text)}${r.source ? `<span class="src">${esc(r.source)}</span>` : ''}</span></div>`;
        }).join('')}</div>`;
    } else if (d.template === 'compare') {
      // Today (struck through step by step) vs with the product (lit up). Items may carry onWord timing.
      document.body.classList.add('deck');
      const was = (d.before?.steps || []).slice(0, 6), now = (d.after?.steps || []).slice(0, 4);
      let at = .3 + count(d.head) * .06;
      const li = (list, cls) => list.map((x) => {
        const o = typeof x === 'string' ? { text: x } : x; const t = o.at ?? at; at = t + .32;
        return `<li class="fade" style="--d:${t.toFixed(2)}s; --x:${(t + .35).toFixed(2)}s"><span>${esc(o.text)}</span></li>`;
      }).join('');
      const wasHtml = li(was, 'was'); at += .2; const nowHtml = li(now, 'now');
      html = `${d.kicker ? `<div class="kicker fade" style="--d:0s">${esc(d.kicker)}</div>` : ''}
        ${d.head ? `<h2 class="head">${words(d.head, .1, .06)}</h2>` : ''}
        <div class="cols">
          <div class="col was"><h3><span>${esc(d.before?.label || 'Today')}</span><span>${esc(d.before?.cost || '')}</span></h3><ol>${wasHtml}</ol></div>
          <div class="col now"><h3><span>${esc(d.after?.label || 'With it')}</span><span>${esc(d.after?.cost || '')}</span></h3><ol>${nowHtml}</ol></div>
        </div>
        ${d.tally ? `<p class="tally fade" style="--d:${(d.tallyAt ?? at + .2).toFixed(2)}s">${words(d.tally, d.tallyAt ?? at + .2, .05)}</p>` : ''}`;
    } else if (d.template === 'flow') {
      // How it works: 3-4 nodes. The connecting line draws across the scene; each node lights at its own time.
      document.body.classList.add('deck');
      const steps = (d.steps || []).slice(0, 4);
      let at = .4 + count(d.head) * .06;
      const times = steps.map((st) => { const t = st.at ?? at; at = t + .9; return t; });
      const draw = Math.max(.6, times.at(-1) - times[0]);
      html = `${d.kicker ? `<div class="kicker fade" style="--d:0s">${esc(d.kicker)}</div>` : ''}
        ${d.head ? `<h2 class="head">${words(d.head, .1, .06)}</h2>` : ''}
        <div class="flow" style="--n:${steps.length}; --d0:${times[0].toFixed(2)}s; --draw:${draw.toFixed(2)}s">
          <div class="track"><i></i></div>
          ${steps.map((st, i) => `<div class="node"><span class="dot" style="--d:${times[i].toFixed(2)}s">${i + 1}</span>
            <b class="fade" style="--d:${times[i].toFixed(2)}s">${esc(st.label)}</b>
            ${st.sub ? `<small class="fade" style="--d:${(times[i] + .12).toFixed(2)}s">${esc(st.sub)}</small>` : ''}</div>`).join('')}
        </div>`;
    } else if (d.template === 'quote') {
      document.body.classList.add('deck');
      html = `${d.kicker ? `<div class="kicker fade" style="--d:0s">${esc(d.kicker)}</div>` : ''}
        <blockquote class="quote">${words(d.text, .2, .045)}</blockquote>
        <p class="who fade" style="--d:${(.4 + count(d.text) * .045).toFixed(2)}s"><b>${esc(d.who || '')}</b>${d.source ? ` · ${esc(d.source)}` : ''}</p>`;
    } else if (d.template === 'end') {
      document.body.classList.add('center');
      html = `<div class="copy">
          <h1 class="name">${words(d.name, .1, .08)}</h1>
          ${d.tagline ? `<p class="tagline" style="max-width:26ch">${words(d.tagline, .45, .04)}</p>` : ''}
          ${d.url ? `<div class="url fade" style="--d:1.0s">${esc(d.url)}</div>` : ''}
          ${d.credit ? `<p class="credit fade" style="--d:1.4s">${esc(d.credit)}</p>` : ''}
        </div>`;
    }
    // Deck chrome: chapter rail and progress line, passed in by record.mjs when plan.deck is on.
    if (d.deck) {
      const { chapters = [], current = -1, from = 0, to = 0 } = d.deck;
      html = `<nav class="rail fade" style="--d:0s">${chapters.map((c, i) => `<span class="${i === current ? 'on' : i < current ? 'done' : ''}">${esc(c)}</span>`).join('')}</nav>`
        + html + `<i class="deckbar" style="--from:${from}%; --to:${to}%"></i>`;
    }
    s.innerHTML = html;
    const imgs = [...document.images].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; }));
    return Promise.all([...imgs, document.fonts.ready]).then(() => true);
  };

  window.go = () => {
    document.body.classList.add('go');
    const el = document.getElementById('stat');
    if (!el) return;
    // Count up the numeric part, keep prefix/suffix ("$4.2B", "73%").
    const m = el.dataset.to.match(/^([^\d]*)([\d.,]+)(.*)$/);
    if (!m) return;
    const target = parseFloat(m[2].replace(/,/g, '')), dec = (m[2].split('.')[1] || '').length, t0 = performance.now();
    el.textContent = m[1] + (0).toFixed(dec) + m[3];
    const tick = (now) => {
      const k = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - k, 4);
      el.textContent = m[1] + (target * e).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[3];
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
</script>
</body>
</html>
