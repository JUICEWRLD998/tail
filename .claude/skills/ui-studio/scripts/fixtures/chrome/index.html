<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth: chrome-tell fixture</title>
<!-- Planted positive control for the template-chrome tells: cream ground + clay accent, tracked
     all-caps eyebrows, middot meta strings, arrow-suffixed buttons, 01/02/03 markers, mono labels
     and a one-word accent headline. ui-score must fire every one of them on this page. -->
<style>
  /* macrostructure: chrome fixture */
  :root { --ground: #f4f1ea; --ink: #26211c; --muted: #5d554c; --clay: #d97757; --font: Georgia, serif; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); }
  main { max-width: 1040px; margin: 0 auto; padding: 72px 32px; }
  .eyebrow { font-family: Arial, sans-serif; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 64px; line-height: 1.05; margin: 12px 0 24px; text-wrap: balance; }
  h1 em { color: var(--clay); }
  h2 { font-size: 32px; margin: 8px 0; }
  .meta { color: var(--muted); font-size: 15px; }
  .mono { font-family: "Courier New", monospace; font-size: 12px; color: var(--muted); }
  .num { font-size: 15px; color: var(--clay); }
  .btn { display: inline-block; padding: 14px 22px; background: var(--clay); color: #fff; border: 0; border-radius: 6px; font-size: 16px; margin-right: 12px; }
  .btn:hover { background: #c4623f; }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .swatch { width: 100%; height: 120px; background: var(--clay); margin: 32px 0; }
  .steps { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none; } }
</style>
</head>
<body>
<main>
  <span class="eyebrow">The kitchen ledger</span>
  <h1>Cook what you <em>actually</em> have</h1>
  <p class="meta">Recipes · Pantry · Planner</p>
  <p class="meta">Updated weekly · Free · No account</p>
  <p class="meta">12 min read · Spring</p>
  <button class="btn">Start cooking →</button>
  <button class="btn">See the pantry →</button>
  <div class="swatch"></div>
  <div class="steps">
    <div><span class="num">01</span><span class="eyebrow">Scan the shelf</span><h2>Scan</h2><span class="mono">step_one</span></div>
    <div><span class="num">02</span><span class="eyebrow">Match the recipes</span><h2>Match</h2><span class="mono">step_two</span></div>
    <div><span class="num">03</span><h2>Cook</h2><span class="mono">step_three</span><span class="mono">v1.0</span></div>
  </div>
</main>
</body>
</html>
