# Render blueprint. Secrets are set in the dashboard (sync: false), never in this file.
# FREE plan (no card): no persistent disk, so the SQLite file lives in the container and is wiped on every deploy, restart
# and spin-down. Fine for a one-sitting demo; for anything longer switch to `plan: starter` and re-add the disk below.
services:
  - type: web
    name: tail
    runtime: docker
    plan: free
    healthCheckPath: /health
    # disk (paid plans only):
    #   disk: { name: tail-data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: TAIL_MODE, value: prod }
      - { key: STRIKE_NETWORK, value: testnet }
      - { key: BUILDER_CODE, value: sigma }
      - { key: BUILDER_FEE_BPS, value: "10" }
      - { key: TAIL_DB, value: /data/tail.db }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TAIL_KEK, sync: false }
      - { key: WEBHOOK_SECRET, sync: false }
      - { key: OPENROUTER_API_KEY, sync: false }
